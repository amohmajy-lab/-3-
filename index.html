<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEBDD;
    --ink:#26302A;
    --primary:#1F4B3F;
    --accent:#A9812E;
    --correct:#3C7A54;
    --incorrect:#A23B2E;
    --neutral:#8A7B3E;
    --line:#D9D3BE;
    --paper-2:#F7F5EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    line-height:1.9;
    padding:28px 14px 80px;
  }
  .sheet{
    max-width:700px;
    margin:0 auto;
    background:var(--paper-2);
    border-top:3px double var(--accent);
    border-bottom:3px double var(--accent);

    font-family:'Amiri',serif;

    color:var(--primary);

    border-bottom:1px solid var(--line);

    padding:16px 0;

  }
  .q-prompt{

  .q-num{

  .q textarea, .q input[type=text]{

  .q textarea:focus, .q input[type=text]:focus{

    border-color:var(--primary);

  .feedback{

    font-size:.92rem;

  .feedback.show{display:block;}

    margin-bottom:3px;

  .q.correct{border-right:3px solid var(--correct);}
  .q.incorrect{border-right:3px solid var(--incorrect);}
  .q.neutral{border-right:3px solid var(--neutral);}
  .q.correct .feedback .tag{color:var(--correct);}
  .q.incorrect .feedback .tag{color:var(--incorrect);}
  .q.neutral .feedback .tag{color:var(--neutral);}

  .actions{

    font-weight:700;

  #gradeBtn{background:var(--primary);color:#fff;}
  #gradeBtn:hover{background:#173a30;}
  #resetBtn{background:transparent;color:var(--ink);border:1px solid var(--line);}
  #resetBtn:hover{border-color:var(--ink);}
  #printBtn{background:transparent;color:var(--accent);border:1px solid var(--accent);}

  #result{
    display:none;
    margin:0 0 30px;
    text-align:center;

    border:1px solid var(--line);

    color:var(--primary);
    font-weight:700;
  }
  #result .pct{

  }
  #result .note{
    font-size:.9rem;
    color:#6b6558;
    margin-top:10px;
  }

    body{background:#fff;padding:0;}
    .sheet{border:none;padding:0;}
    .actions{display:none;}
    textarea,input[type=text]{border:none !important;background:transparent !important;}
  }
</style>

<body>
<div class="sheet">
  <div class="ornament"></div>
  <h1>اختبار حفظ وفهم – الصفحة الثالثة من سورة البقرة</h1>
  <div class="sub">الآيات 17 – 24</div>

  <div class="meta-row">
    <div>
      <label>الاسم</label>
      <input type="text" id="studentName" placeholder="...........................">
    </div>
  </div>

  <div id="quiz"></div>

  <div id="result">
    <div class="score" id="scoreText">0 / 20</div>
    <div class="pct" id="pctText"></div>
    <div class="note">التصحيح لا يدقّق على التشكيل أو الهمزات أو المدود، ويقبل الإجابات القريبة من الصواب. السؤال الأخير تأملي ويُفضّل مراجعته يدويًا.</div>
  </div>

  <div class="actions">
    <button id="gradeBtn">صحّح الاختبار</button>
    <button id="resetBtn" type="button">إعادة تعيين</button>
    <button id="printBtn" type="button">طباعة / حفظ PDF</button>
  </div>
</div>

<script>
/* ============ تطبيع النص العربي ============ */
function normalize(text){
  if(!text) return '';
  return text
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u08F0-\u08FF]/g,'')
    .replace(/\u0640/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/[ؤئء]/g,'')
    .replace(/[﴿﴾۝.,،؟!:\-–—()]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(a[i-1]===b[j-1]) dp[i][j]=dp[i-1][j-1];
      else dp[i][j]=1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function wordsFuzzyMatch(w1,w2){
  if(w1===w2) return true;
  const ref = w2.length>=w1.length ? w2 : w1;
  const threshold = ref.length<=3 ? 1 : Math.max(1,Math.floor(ref.length*0.28));
  return levenshtein(w1,w2)<=threshold;
}

function containsPhrase(answerNorm, phraseNorm){
  const a = answerNorm.split(' ').filter(Boolean);
  const p = phraseNorm.split(' ').filter(Boolean);
  if(p.length===0) return false;
  for(let i=0;i<=a.length-p.length;i++){
    let ok=true;
    for(let j=0;j<p.length;j++){
      if(!wordsFuzzyMatch(a[i+j],p[j])){ok=false;break;}
    }
    if(ok) return true;
  }
  if(p.length===1){
    return a.some(w => w.includes(p[0]) || (p[0].length>=3 && wordsFuzzyMatch(w,p[0])));
  }
  return false;
}

/* عدد "النقاط" المستقلة في إجابة تأملية مفتوحة */
function countPoints(raw){
  const parts = raw
    .split(/\n|؛|•|-|،(?=\s*\d)|(?:^|\s)\d+[\).]/g)
    .map(s=>s.trim())
    .filter(s=>s.length>=8 && s.split(/\s+/).length>=3);
  if(parts.length>=2) return parts.length;
  // إجابة في سطر واحد بدون فواصل: عدّها نقطة واحدة فقط
  return raw.trim().length>=8 ? 1 : 0;
}

/* ============ بيانات الأسئلة – الصفحة الثالثة ============ */
const questions = [
{part:'أولًا: أكمل قوله تعالى', id:1, type:'phrase',
  prompt:'﴿مَثَلُهُمْ كَمَثَلِ الَّذِي ...﴾ .... إلى .... ﴿...لَا يُبْصِرُونَ﴾',
  accept:['استوقد نارا','استوقد'],
  full:'مَثَلُهُمْ كَمَثَلِ الَّذِي اسْتَوْقَدَ نَارًا فَلَمَّا أَضَاءَتْ مَا حَوْلَهُ ذَهَبَ اللَّهُ بِنُورِهِمْ وَتَرَكَهُمْ فِي ظُلُمَاتٍ لَا يُبْصِرُونَ'},

{id:2, type:'phrase',
  prompt:'﴿صُمٌّ ...﴾ .... إلى .... ﴿...لَا يَرْجِعُونَ﴾',
  accept:['بكم عمي','بكم'],
  full:'صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَرْجِعُونَ'},

{id:3, type:'phrase',
  prompt:'﴿أَوْ كَصَيِّبٍ ...﴾ .... إلى .... ﴿...بِالْكَافِرِينَ﴾',
  accept:['من السماء','فيه ظلمات'],
  full:'أَوْ كَصَيِّبٍ مِنَ السَّمَاءِ فِيهِ ظُلُمَاتٌ وَرَعْدٌ وَبَرْقٌ يَجْعَلُونَ أَصَابِعَهُمْ فِي آذَانِهِمْ مِنَ الصَّوَاعِقِ حَذَرَ الْمَوْتِ وَاللَّهُ مُحِيطٌ بِالْكَافِرِينَ'},

{id:4, type:'phrase',
  prompt:'﴿يَكَادُ الْبَرْقُ ...﴾ .... إلى .... ﴿...قَدِيرٌ﴾',
  accept:['يخطف ابصارهم','يخطف'],
  full:'يَكَادُ الْبَرْقُ يَخْطَفُ أَبْصَارَهُمْ كُلَّمَا أَضَاءَ لَهُمْ مَشَوْا فِيهِ وَإِذَا أَظْلَمَ عَلَيْهِمْ قَامُوا وَلَوْ شَاءَ اللَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَارِهِمْ إِنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ'},

{id:5, type:'phrase',
  prompt:'﴿يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ...﴾ .... إلى .... ﴿...لَعَلَّكُمْ تَتَّقُونَ﴾',
  accept:['الذي خلقكم','خلقكم'],
  full:'يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ وَالَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ'},

{part:'ثانيًا: ما الكلمة التي جاءت...', id:6, type:'phrase',
  prompt:'ما الكلمة التي جاءت بعد: ﴿ذَهَبَ اللَّهُ﴾؟',
  accept:['بنورهم'], full:'بِنُورِهِمْ'},

{id:7, type:'phrase',
  prompt:'ما الكلمة التي جاءت قبل: ﴿أَنْدَادًا﴾؟',
  accept:['لله'], full:'لِلَّهِ'},

{part:'ثالثًا: صحح الكلمة الخاطئة', id:8, type:'phrase',
  prompt:'﴿مَثَلُهُمْ كَمَثَلِ الَّذِي أَشْعَلَ نَارًا فَلَمَّا أَضَاءَتْ مَا حَوْلَهُ﴾',
  accept:['استوقد'],
  full:'الصواب: اسْتَوْقَدَ (بدل أَشْعَلَ) — ﴿مَثَلُهُمْ كَمَثَلِ الَّذِي اسْتَوْقَدَ نَارًا﴾'},

{id:9, type:'phrase',
  prompt:'﴿صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَعْقِلُونَ﴾',
  accept:['يرجعون'],
  full:'الصواب: يَرْجِعُونَ (بدل يَعْقِلُونَ) — ﴿صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَرْجِعُونَ﴾'},

{id:10, type:'phrase',
  prompt:'﴿يَجْعَلُونَ أَيْدِيَهُمْ فِي آذَانِهِمْ مِنَ الصَّوَاعِقِ﴾',
  accept:['اصابعهم'],
  full:'الصواب: أَصَابِعَهُمْ (بدل أَيْدِيَهُمْ) — ﴿يَجْعَلُونَ أَصَابِعَهُمْ فِي آذَانِهِمْ مِنَ الصَّوَاعِقِ﴾'},

{id:11, type:'phrase',
  prompt:'﴿فَلَا تَجْعَلُوا لِلَّهِ شُرَكَاءَ وَأَنْتُمْ تَعْلَمُونَ﴾',
  accept:['اندادا','انداد'],
  full:'الصواب: أَنْدَادًا (بدل شُرَكَاءَ) — ﴿فَلَا تَجْعَلُوا لِلَّهِ أَنْدَادًا وَأَنْتُمْ تَعْلَمُونَ﴾'},

{part:'رابعًا: اكتب', id:12, type:'phrase',
  prompt:'اكتب آية فيها ذكر خلق الإنسان ومن قبلهم',
  accept:['خلقكم والذين من قبلكم','خلقكم'],
  full:'﴿اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ وَالَّذِينَ مِنْ قَبْلِكُمْ﴾'},

{id:13, type:'phrase',
  prompt:'اكتب آية فيها تحدٍّ بالإتيان بسورة من مثل القرآن',
  accept:['فاتوا بسورة من مثله','بسورة من مثله'],
  full:'﴿فَأْتُوا بِسُورَةٍ مِنْ مِثْلِهِ وَادْعُوا شُهَدَاءَكُمْ مِنْ دُونِ اللَّهِ إِنْ كُنْتُمْ صَادِقِينَ﴾'},

{part:'خامسًا: رتب الكلمات', id:14, type:'phrase',
  prompt:'(لا – يبصرون – في – ظلمات – وتركهم)',
  accept:['وتركهم في ظلمات لا يبصرون'], full:'وَتَرَكَهُمْ فِي ظُلُمَاتٍ لَا يُبْصِرُونَ'},

{id:15, type:'phrase',
  prompt:'(الناس – ربكم – اعبدوا – يا – أيها)',
  accept:['يا ايها الناس اعبدوا ربكم'], full:'يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ'},

{part:'سادسًا: اكتب الكلمة الناقصة', id:16, type:'phrase',
  prompt:'﴿مَثَلُهُمْ كَمَثَلِ الَّذِي اسْتَوْقَدَ ________﴾',
  accept:['نارا'], full:'نَارًا'},

{id:17, type:'phrase',
  prompt:'﴿وَاللَّهُ ________ بِالْكَافِرِينَ﴾',
  accept:['محيط'], full:'مُحِيطٌ'},

{id:18, type:'phrase',
  prompt:'﴿الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ________ وَالسَّمَاءَ بِنَاءً﴾',
  accept:['فراشا'], full:'فِرَاشًا'},

{id:19, type:'phrase',
  prompt:'﴿فَإِنْ لَمْ تَفْعَلُوا وَلَنْ ________ فَاتَّقُوا النَّارَ﴾',
  accept:['تفعلوا'], full:'تَفْعَلُوا'},

{part:'سابعًا: فهم الآيات', id:20, type:'reflection', required:2,
  prompt:'ما الفوائد التي تعلمتها من هذه الصفحة؟ اذكر فائدتين باختصار.',
  full:'أمثلة على فوائد مقبولة: قدرة الله وإحاطته بكل شيء، التحذير من صفات المنافقين وضرب الأمثال لهم، وجوب إفراد الله بالعبادة وعدم اتخاذ الأنداد، إعجاز القرآن وعجز الخلق عن الإتيان بمثله، التحذير من عذاب النار.'}
];

/* ============ بناء الأسئلة في الصفحة ============ */
const quizEl = document.getElementById('quiz');
questions.forEach(q=>{
  if(q.part){
    const h = document.createElement('div');
    h.className='part-title';
    h.textContent = q.part;
    quizEl.appendChild(h);
  }
  const wrap = document.createElement('div');
  wrap.className='q';
  wrap.id = 'q'+q.id;
  const isLong = q.type==='reflection';
  wrap.innerHTML = `
    <div class="q-prompt"><span class="q-num">${q.id}.</span>${q.prompt}</div>
    ${isLong
      ? `<textarea rows="3" data-qid="${q.id}" placeholder="اكتب إجابتك هنا (فائدة في كل سطر)..."></textarea>`
      : `<input type="text" data-qid="${q.id}" placeholder="اكتب إجابتك هنا...">`}
    <div class="feedback" id="fb${q.id}"></div>
  `;
  quizEl.appendChild(wrap);
});

/* ============ التصحيح ============ */
document.getElementById('gradeBtn').addEventListener('click', ()=>{
  let score = 0;
  questions.forEach(q=>{
    const el = document.querySelector(`[data-qid="${q.id}"]`);
    const raw = el.value || '';
    const norm = normalize(raw);
    const qWrap = document.getElementById('q'+q.id);
    const fb = document.getElementById('fb'+q.id);
    let correct = false;
    let neutral = false;
    let extra = '';

    if(q.type==='phrase'){
      correct = q.accept.some(acc => containsPhrase(norm, normalize(acc)));
    } else if(q.type==='reflection'){
      const pts = countPoints(raw.trim());
      correct = pts >= (q.required||2);
      neutral = true; // سؤال تأملي دائمًا يحتاج مراجعة المعلم
      extra = correct
        ? 'تم رصد نقطتين مختلفتين تقريبًا — يُفضّل أن يراجع المعلم مضمونهما.'
        : `يبدو أن الإجابة تحتوي نقطة واحدة فقط. يُطلب ذكر فائدتين منفصلتين (كل واحدة في سطر).`;
    }

    qWrap.classList.remove('correct','incorrect','neutral');
    fb.classList.add('show');

    if(raw.trim()===''){
      qWrap.classList.add('incorrect');
      fb.innerHTML = `<span class="tag">لم تتم الإجابة —</span> ${q.type==='reflection' ? 'يُطلب ذكر فائدتين.' : `الإجابة الصحيحة: <span class="correct-ans">${q.full}</span>`}`;
    } else if(q.type==='reflection'){
      if(correct) score++;
      qWrap.classList.add('neutral');
      fb.innerHTML = `<span class="tag">${correct ? 'إجابة مقبولة شكليًا (بحاجة مراجعة) ⚠' : 'غير مكتملة'}</span><br>${extra}<br><span class="correct-ans">${q.full}</span>`;
    } else if(correct){
      score++;
      qWrap.classList.add('correct');
      fb.innerHTML = `<span class="tag">إجابة صحيحة ✓</span>`;
    } else {
      qWrap.classList.add('incorrect');
      fb.innerHTML = `<span class="tag">غير دقيقة —</span> الإجابة الصحيحة: <span class="correct-ans">${q.full}</span>`;
    }
  });

  const resultEl = document.getElementById('result');
  resultEl.classList.remove('show');
  void resultEl.offsetWidth;
  resultEl.classList.add('show');
  document.getElementById('scoreText').textContent = `${score} / 20`;
  const pct = Math.round((score/20)*100);
  document.getElementById('pctText').textContent = `النسبة: ${pct}%`;
  resultEl.scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  document.querySelectorAll('.q input, .q textarea').forEach(el=>el.value='');
  document.querySelectorAll('.q').forEach(el=>el.classList.remove('correct','incorrect','neutral'));
  document.querySelectorAll('.feedback').forEach(el=>{el.classList.remove('show'); el.innerHTML='';});
  document.getElementById('result').classList.remove('show');
  document.getElementById('studentName').value='';
});

document.getElementById('printBtn').addEventListener('click', ()=> window.print());
</script>
</body>
</html>
